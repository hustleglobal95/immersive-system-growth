name: Zensia Signature Repair Preflight

on:
  push:
    branches:
      - project/zensia-signature-repair
    paths:
      - .github/workflows/zensia-signature-repair-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write structured repair brief
        run: |
          mkdir -p .forge/execution/zensia-signature-repair
          cat > .forge/execution/zensia-signature-repair/brief.json <<'EOF'
          {
            "projectName": "Zensia Coffee Signature Repair",
            "projectType": "hospitality",
            "tier": "signature",
            "client": "Zensia Coffee",
            "audience": "Coffee drinkers, design-aware locals, remote workers and visitors looking for a calm Colombian specialty-coffee experience in Clayton and St. Louis.",
            "objective": "Repair the already-merged Zensia signature slice so Calm Mode visibly and meaningfully reorganizes pace, hierarchy, spatial state and atmosphere instead of behaving like a minor color or spacing toggle.",
            "primaryAction": "Visit Zensia",
            "brandTruth": "Zensia is a Colombian specialty-coffee hospitality brand built around calm, lingering and intentional pauses. The signature interaction must embody the transition from city pace into a slower, more spacious stay.",
            "differentiators": [
              "Colombian specialty-coffee point of view",
              "A physical space designed for lingering and calm",
              "Coffee ritual and origin as part of the guest experience",
              "Community and repeat-visit behavior through Calm Club"
            ],
            "constraints": [
              "Repair only the protected Experience to Signature to Stillness slice before broader expansion",
              "Calm Mode must create a visibly stronger before/after state on desktop and mobile",
              "Keep Order Online, Menu, Visit and Calm Club actions semantic and obvious",
              "Preserve one persistent spatial world and deterministic reverse-safe behavior",
              "Do not add generic luxury styling, floating bean spectacle, constant motion or unrelated decorative systems",
              "Do not invent client facts or reuse third-party editorial imagery without rights"
            ],
            "existingAssets": [],
            "references": [
              {
                "label": "Current merged Zensia render evidence",
                "lesson": "The current Calm Mode is too visually similar before and after; it must reorganize composition, negative space, atmosphere and spatial emphasis strongly enough to read as the signature mechanism."
              },
              {
                "label": "Forge hospitality construction intelligence",
                "lesson": "Use threshold-passage, continuous visual anchor, macro-to-whole rhythm, density rhythm and visual silence, with one protected peak and a quiet recovery state."
              }
            ]
          }
          EOF
      - name: Run repair preflight
        env:
          STUDIO_AUTH_ENABLED: "false"
          FORGE_LOCAL_STORAGE_ENABLED: "true"
          NODE_ENV: development
        run: |
          npm run forge:preflight -- \
            --name="Zensia Signature Repair" \
            --brief=.forge/execution/zensia-signature-repair/brief.json \
            --artifacts=.forge/execution/zensia-signature-repair/artifacts \
            --record=forge-intelligence/execution-records/zensia-signature-repair.json
      - name: Validate repair evidence
        run: npm run forge:execution:audit -- --record=forge-intelligence/execution-records/zensia-signature-repair.json
      - name: Print repair packet
        run: |
          echo '===== ZENSIA REPAIR PACKET ====='
          cat .forge/execution/zensia-signature-repair/artifacts/forge-build-packet.md
          echo '===== ARTIFACT INDEX ====='
          find .forge/execution/zensia-signature-repair/artifacts -maxdepth 2 -type f -print | sort
      - name: Commit public-safe repair record
        run: |
          git config user.name "forge-preflight"
          git config user.email "actions@users.noreply.github.com"
          git add forge-intelligence/execution-records/zensia-signature-repair.json
          git commit -m "Record Zensia signature repair preflight [forge-preflight-record]"
          git push origin HEAD:project/zensia-signature-repair
