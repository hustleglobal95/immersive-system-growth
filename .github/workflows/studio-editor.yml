name: Studio editor verification
on:
  push:
    branches:
      - feat/heliot-cinematic-experience
  pull_request:
permissions:
  contents: read
concurrency:
  group: studio-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studio-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify real Studio editing and export
        run: node --import tsx scripts/verify-studio-editor.mjs
      - name: Upload Studio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-editor-evidence
          path: test-results/studio-editor/
          if-no-files-found: warn
          retention-days: 14
