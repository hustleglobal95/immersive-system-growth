name: Studio editor verification
on:
  push:
    branches: [feat/heliot-cinematic-experience]
    paths:
      - 'src/studio/**'
      - 'src/components/three/**'
      - 'src/experiences/heliot/**'
      - 'app/studio/**'
      - 'tests/studio-builder-authoring.test.ts'
      - 'scripts/verify-studio-editor.mjs'
      - '.github/workflows/studio-editor.yml'
permissions:
  contents: read
concurrency:
  group: studio-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src/studio/StudioWorkspace.tsx src/studio/StudioLivePreview.tsx src/studio/CameraPathEditor.tsx src/studio/StudioViewportTools.tsx src/studio/workspaceOperations.ts
      - run: node --import tsx --test tests/studio-builder-authoring.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node --import tsx scripts/verify-studio-editor.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-editor-evidence
          path: test-results/studio-editor/
          retention-days: 14
