name: Studio editor verification
on:
  push:
    branches:
      - feat/heliot-cinematic-experience
  pull_request:
permissions:
  contents: read
concurrency:
  group: studio-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studio-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        id: build
      - run: npx playwright install --with-deps chromium
        id: browser
      - name: Verify real Studio editing and export
        timeout-minutes: 7
        run: node --import tsx scripts/verify-studio-editor.mjs
      - name: Verify storage recovery and asset-kit compatibility
        if: always() && steps.build.outcome == 'success' && steps.browser.outcome == 'success'
        timeout-minutes: 4
        run: npx playwright test tests/browser/studio-storage.spec.ts tests/browser/asset-bank.spec.ts --project=chromium --output=test-results/studio-storage
      - name: Upload Studio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-editor-evidence
          path: |
            test-results/studio-editor/
            test-results/studio-storage/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
