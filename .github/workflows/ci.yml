name: Forge CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: forge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start current Forge production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/forge-next.log 2>&1 &
          echo $! > /tmp/forge-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/forge-next.log
          exit 1
      - name: Capture current showcase delivery evidence
        run: timeout 420s node scripts/capture-showcase.mjs
      - name: Stop current Forge production server
        if: always()
        run: |
          if [ -f /tmp/forge-next.pid ]; then
            kill "$(cat /tmp/forge-next.pid)" || true
          fi
      - name: Upload current showcase screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-showcase-screenshots
          path: test-results/showcase/
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prove local Forge readiness
        env:
          STUDIO_AUTH_ENABLED: "false"
          FORGE_LOCAL_STORAGE_ENABLED: "true"
          NODE_ENV: development
        run: npm run forge:readiness -- --profile=local --strict
      - name: Compile representative Claude Build Packet
        run: npm run forge:build-packet -- --output=test-results/forge-build-packet.md
      - run: npm run check
      - run: npm run bank:validate
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --max-failures=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
