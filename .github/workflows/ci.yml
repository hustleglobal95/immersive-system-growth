name: Forge CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: forge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start NOCTERRA production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/nocterra-next.log 2>&1 &
          echo $! > /tmp/nocterra-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nocterra-next.log
          exit 1
      - name: Capture NOCTERRA delivery evidence
        run: timeout 120s node scripts/capture-nocterra.mjs
      - name: Stop NOCTERRA production server
        if: always()
        run: |
          if [ -f /tmp/nocterra-next.pid ]; then
            kill "$(cat /tmp/nocterra-next.pid)" || true
          fi
      - name: Upload NOCTERRA screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nocterra-screenshots
          path: test-results/nocterra/
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run bank:validate
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --max-failures=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
