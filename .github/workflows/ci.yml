name: Forge CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: forge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start current Forge production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/forge-next.log 2>&1 &
          echo $! > /tmp/forge-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/forge-next.log
          exit 1
      - name: Capture current showcase delivery evidence
        run: timeout 420s node scripts/capture-showcase.mjs
      - name: Stop current Forge production server
        if: always()
        run: |
          if [ -f /tmp/forge-next.pid ]; then
            kill "$(cat /tmp/forge-next.pid)" || true
          fi
      - name: Upload current showcase screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-showcase-screenshots
          path: test-results/showcase/
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prove local Forge readiness
        env:
          STUDIO_AUTH_ENABLED: "false"
          FORGE_LOCAL_STORAGE_ENABLED: "true"
          NODE_ENV: development
        run: npm run forge:readiness -- --profile=local --strict
      - name: Write representative Forge request
        run: |
          mkdir -p test-results
          cat > test-results/ci-forge-request.txt <<'EOF'
          Create a premium cinematic interactive 3D product launch with one unforgettable assembly reveal, restrained typography, strong mobile translation and excellent first-use performance.
          EOF
      - name: Exercise full-system Forge preflight
        env:
          FORGE_EXECUTION_ATTESTATION_KEY: ${{ secrets.FORGE_EXECUTION_ATTESTATION_KEY }}
          FORGE_EXECUTION_ATTESTATION_KEY_ID: github-actions
        run: npm run forge:preflight -- --name="CI Signature Product" --prompt-file=test-results/ci-forge-request.txt --artifacts=test-results/forge-execution --record=test-results/forge-execution-record.json
      - name: Validate representative execution record
        env:
          FORGE_EXECUTION_ATTESTATION_KEY: ${{ secrets.FORGE_EXECUTION_ATTESTATION_KEY }}
        run: npm run forge:execution:audit -- --record=test-results/forge-execution-record.json
      - name: Enforce Forge preflight on governed creative PR changes
        if: github.event_name == 'pull_request'
        env:
          FORGE_EXECUTION_BASE_REF: origin/${{ github.base_ref }}
          FORGE_EXECUTION_ATTESTATION_KEY: ${{ secrets.FORGE_EXECUTION_ATTESTATION_KEY }}
        run: npm run forge:execution:audit -- --changed
      - run: npm run check
      - run: npm run bank:validate
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --max-failures=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
