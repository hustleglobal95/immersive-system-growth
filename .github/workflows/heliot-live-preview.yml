name: Original HELIOT live preview

on:
  push:
    branches:
      - preview/original-heliot-live

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deploy exact restored source to Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(npx --yes vercel@latest deploy --yes --token="$VERCEL_TOKEN")"
          echo "HELIOT_PREVIEW_URL=$url"
