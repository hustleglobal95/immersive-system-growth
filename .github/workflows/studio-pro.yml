name: Studio Pro acceptance
on:
  workflow_dispatch:
  push:
    branches: [feat/studio-pro-final]
  pull_request:
    paths:
      - 'src/studio/**'
      - 'app/studio/**'
      - 'app/api/studio/**'
      - 'scripts/verify-studio-pro.mjs'
permissions:
  contents: read
concurrency:
  group: studio-pro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test the complete Studio authoring workflow
        run: node --import tsx scripts/verify-studio-pro.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-pro-acceptance
          path: test-results/studio-pro/
          retention-days: 14
