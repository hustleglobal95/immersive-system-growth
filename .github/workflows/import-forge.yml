name: Import Forge Repository

on:
  push:
    branches:
      - forge-import
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forge-import

      - name: Rebuild and verify Forge bundle
        shell: bash
        run: |
          cat \
            .forge/chunk_00 \
            .forge/chunk_01 \
            .forge/chunk_02 \
            .forge/chunk_03 \
            .forge/chunk_04 \
            .forge/chunk_05 \
            .forge/chunk_06a \
            .forge/chunk_06b \
            .forge/chunk_07 \
            .forge/chunk_08 \
            .forge/chunk_09 \
            .forge/chunk_10 \
            .forge/chunk_11 \
            | base64 -d > /tmp/immersive-site-forge.gitbundle
          echo "11c2ef13c705b1e20ac2dc71d3e2f39144e32d1b468c3a9e817682c8bb789ac7  /tmp/immersive-site-forge.gitbundle" | sha256sum -c -
          git bundle verify /tmp/immersive-site-forge.gitbundle

      - name: Force exact Forge history onto main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          rm -rf /tmp/forge-imported
          git clone /tmp/immersive-site-forge.gitbundle /tmp/forge-imported
          cd /tmp/forge-imported
          test "$(git rev-parse HEAD)" = "a53f52ce5b6d1c317f2c9a35b6f1c8a3b6a019bb"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin main:main --force
