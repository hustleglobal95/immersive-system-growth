name: Zensia Coffeehouse Final Preflight

on:
  push:
    branches:
      - project/zensia-coffeehouse-preflight
    paths:
      - .github/workflows/zensia-coffeehouse-final-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write structured creative brief
        run: |
          mkdir -p .forge/execution/zensia-coffeehouse-final
          cat > .forge/execution/zensia-coffeehouse-final/brief.json <<'EOF'
          {
            "projectName": "Zensia Coffeehouse Final",
            "projectType": "hospitality",
            "tier": "signature",
            "client": "Zensia Coffee",
            "audience": "Coffee drinkers, local regulars, remote workers and visitors evaluating Zensia as a premium Colombian specialty-coffee destination.",
            "objective": "Rebuild Zensia as one coherent immersive coffee-house experience centered on a persistent interactive coffee cup that carries through scroll into preparation, then opens into a real product rack, brew recipes, full interactive menu, origin story, loyalty and visit flow.",
            "primaryAction": "Order online",
            "brandTruth": "Zensia is Colombian specialty coffee expressed through calm hospitality, tactile ritual, real coffee product and a physical place designed to let people stay.",
            "differentiators": [
              "Persistent interactive 3D coffee cup as the main hero object",
              "Real Zen at Home product packaging",
              "Full interactive current menu",
              "Colombian coffee identity and calm hospitality",
              "Coffeehouse experience rather than a generic marketing page"
            ],
            "constraints": [
              "Use the existing Zensia route, current menu data and real Zensia product imagery",
              "The main cup must feel dimensional, interactive and visibly emit animated steam",
              "Carry the cup through the next scroll chapter instead of discarding it after hero",
              "Use GSAP ScrollTrigger for controlled cinematic movement and reduced motion fallbacks",
              "Include a coffee rack, brew-recipe chapter, full interactive menu, origin, loyalty and visit flow",
              "Typography must remain professional and restrained",
              "Do not invent farm names, sourcing statistics, awards, prices or unsupported coffee facts",
              "Mobile must preserve the narrative without horizontal overflow or excessive simultaneous motion",
              "Do not use effect quantity as a substitute for composition"
            ],
            "existingAssets": [],
            "references": [
              {
                "label": "Existing Zensia production project",
                "lesson": "Preserve verified business content, current menu structure and real product photography while replacing the fragmented visual composition."
              },
              {
                "label": "Forge hospitality construction knowledge",
                "lesson": "Keep a single signature object and let interaction, typography, imagery and commerce support one visual thesis."
              }
            ]
          }
          EOF
      - name: Run Forge preflight
        env:
          STUDIO_AUTH_ENABLED: "false"
          FORGE_LOCAL_STORAGE_ENABLED: "true"
          NODE_ENV: development
        run: |
          npm run forge:preflight -- \
            --name="Zensia Coffeehouse Final" \
            --brief=.forge/execution/zensia-coffeehouse-final/brief.json \
            --artifacts=.forge/execution/zensia-coffeehouse-final/artifacts \
            --record=forge-intelligence/execution-records/zensia-coffeehouse-final.json
      - name: Validate execution evidence
        run: npm run forge:execution:audit -- --record=forge-intelligence/execution-records/zensia-coffeehouse-final.json
      - name: Commit public-safe record
        run: |
          git config user.name "forge-preflight"
          git config user.email "actions@users.noreply.github.com"
          git add forge-intelligence/execution-records/zensia-coffeehouse-final.json
          git commit -m "Record Zensia coffeehouse preflight [forge-preflight-record]"
          git push origin HEAD:project/zensia-coffeehouse-preflight
