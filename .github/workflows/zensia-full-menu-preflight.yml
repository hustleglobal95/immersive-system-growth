name: Zensia Photo Menu Repair Preflight

on:
  push:
    branches:
      - project/zensia-photo-menu-repair
    paths:
      - .github/workflows/zensia-full-menu-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write structured photo-first menu repair brief
        run: |
          mkdir -p .forge/execution/zensia-photo-menu-repair
          cat > .forge/execution/zensia-photo-menu-repair/brief.json <<'EOF'
          {
            "projectName": "Zensia Photo-First Immersive Menu Repair",
            "projectType": "hospitality",
            "tier": "signature",
            "client": "Zensia Coffee",
            "audience": "Visitors deciding what to order before or during a Zensia visit.",
            "objective": "Replace the synthetic menu centerpiece with an authentic photo-first interactive menu where real Zensia product photography drives selection, motion, hierarchy and ordering.",
            "primaryAction": "Order online",
            "brandTruth": "The products are the experience. The menu should feel editorial, tactile and calm without fake procedural food or decorative UI spectacle.",
            "differentiators": [
              "Real Zensia product photography",
              "Colombian specialty coffee and café hospitality",
              "A broad menu spanning hot drinks, espresso, cold drinks, Colombian breads, empanadas and desserts",
              "Existing GSAP and Forge mask language"
            ],
            "constraints": [
              "Remove the fake procedural vessel, orbit and steam representation from the menu",
              "Use real Zensia product photography where authentic imagery exists",
              "Never synthesize a missing menu item image",
              "Use an intentional editorial fallback for menu items without authentic photography",
              "Keep all 44 core menu items and all 11 listed flavor variants",
              "Do not invent prices, sizes, ingredients or availability",
              "Keep every item accessible by keyboard and touch",
              "Use GSAP and Forge mask transitions for category and active-item choreography",
              "Preserve Order Online and the full menu search",
              "Mobile must provide the full menu without horizontal page overflow",
              "The uploaded coffee splash is connective motion, not the primary representation of every product"
            ],
            "existingAssets": [
              "Current Zensia product photography already referenced by the checked-in experience",
              "Uploaded Zensia coffee splash asset already integrated in the checked-in menu"
            ],
            "references": [
              {
                "label": "Photo-first editorial product browsing",
                "lesson": "The selected product must dominate the stage while navigation remains fast and legible."
              },
              {
                "label": "Current Zensia Forge build",
                "lesson": "Preserve the strongest GSAP and mask language but remove synthetic product representations."
              }
            ]
          }
          EOF
      - name: Run Forge preflight
        env:
          STUDIO_AUTH_ENABLED: "false"
          FORGE_LOCAL_STORAGE_ENABLED: "true"
          NODE_ENV: development
        run: |
          npm run forge:preflight -- \
            --name="Zensia Photo-First Immersive Menu Repair" \
            --brief=.forge/execution/zensia-photo-menu-repair/brief.json \
            --artifacts=.forge/execution/zensia-photo-menu-repair/artifacts \
            --record=forge-intelligence/execution-records/zensia-photo-menu-repair.json
      - name: Validate execution evidence
        run: npm run forge:execution:audit -- --record=forge-intelligence/execution-records/zensia-photo-menu-repair.json
      - name: Print build packet
        run: |
          echo '===== BUILD PACKET ====='
          cat .forge/execution/zensia-photo-menu-repair/artifacts/forge-build-packet.md
      - name: Commit public-safe record
        run: |
          git config user.name "forge-preflight"
          git config user.email "actions@users.noreply.github.com"
          git add forge-intelligence/execution-records/zensia-photo-menu-repair.json
          git commit -m "Record Zensia photo menu repair preflight [forge-preflight-record]" || true
          git push origin HEAD:project/zensia-photo-menu-repair
