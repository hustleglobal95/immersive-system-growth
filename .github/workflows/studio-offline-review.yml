name: Studio reproducible review
on:
  workflow_dispatch:
  push:
    branches: [feat/heliot-cinematic-experience]
    paths: [.github/workflows/studio-offline-review.yml]
permissions:
  contents: read
jobs:
  review-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Package reproducible workspace for local verification
        run: |
          mkdir -p /tmp/studio-review
          git archive --format=tar HEAD | tar -xf - -C /tmp/studio-review
          cp -a node_modules /tmp/studio-review/node_modules
          printf '%s\n' "$GITHUB_SHA" > /tmp/studio-review/REVIEW_COMMIT
          tar -czf /tmp/studio-review.tar.gz -C /tmp/studio-review .
      - uses: actions/upload-artifact@v4
        with:
          name: studio-review-workspace
          path: /tmp/studio-review.tar.gz
          retention-days: 1
          compression-level: 0
