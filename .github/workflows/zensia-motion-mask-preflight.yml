name: Zensia Motion Mask Preflight

on:
  push:
    branches:
      - project/zensia-motion-masks
    paths:
      - .github/workflows/zensia-motion-mask-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write structured request
        run: |
          mkdir -p .forge/execution/zensia-motion-masks
          cat > .forge/execution/zensia-motion-masks/brief.json <<'EOF'
          {
            "projectName": "Zensia Coffee Motion Masks",
            "projectType": "hospitality",
            "tier": "signature",
            "client": "Zensia Coffee",
            "audience": "Coffee drinkers, design-aware locals, remote workers and visitors considering Zensia in Clayton and St. Louis.",
            "objective": "Strengthen the current Zensia website with controlled GSAP choreography and Forge-native mask reveals while preserving its product-first Brewns-inspired direction.",
            "primaryAction": "Order online",
            "brandTruth": "Zensia is Colombian specialty coffee presented through calm hospitality, real product, community and a physical place designed to slow the day down.",
            "differentiators": [
              "Colombian specialty-coffee identity",
              "Real Zen at Home coffee products",
              "Calm Club rewards and direct ordering",
              "A physical café centered on lingering and community"
            ],
            "constraints": [
              "Use Forge Reveal Engine and GSAP systems before new primitives",
              "Add masked media entrances, product motion, parallax, countermotion and section handoffs",
              "Preserve current commerce actions and real Zensia assets",
              "Do not reintroduce the pace slider, generic WebGL spectacle or effect soup",
              "Reduced motion must preserve every content and conversion outcome",
              "Mobile must keep the concept with lower amplitude and fewer simultaneous effects"
            ],
            "existingAssets": [],
            "references": [
              {
                "label": "Brewns — Forge hospitality precedent",
                "lesson": "Keep packaging as hero, typography environmental, and motion subordinate to coffee/product hierarchy."
              }
            ]
          }
          EOF
      - name: Run Forge preflight
        env:
          STUDIO_AUTH_ENABLED: "false"
          FORGE_LOCAL_STORAGE_ENABLED: "true"
          NODE_ENV: development
        run: |
          npm run forge:preflight -- \
            --name="Zensia Coffee Motion Masks" \
            --brief=.forge/execution/zensia-motion-masks/brief.json \
            --artifacts=.forge/execution/zensia-motion-masks/artifacts \
            --record=forge-intelligence/execution-records/zensia-motion-masks.json
      - name: Compile motion context
        run: |
          npm run forge:context -- \
            --domain="motion" \
            --scene="signature" \
            --objective="Strengthen Zensia with controlled GSAP choreography and deterministic Forge-native mask reveals" \
            --prompt="Upgrade the current Zensia Coffee website with substantially stronger GSAP motion and Forge-native mask reveals." \
            --name="Zensia Coffee Motion Masks" \
            --output=.forge/execution/zensia-motion-masks/motion-context.json
      - name: Validate execution evidence
        run: npm run forge:execution:audit -- --record=forge-intelligence/execution-records/zensia-motion-masks.json
      - name: Print packet and motion context
        run: |
          cat .forge/execution/zensia-motion-masks/artifacts/forge-build-packet.md
          echo "===== MOTION CONTEXT ====="
          cat .forge/execution/zensia-motion-masks/motion-context.json
      - name: Commit public-safe record
        run: |
          git config user.name "forge-preflight"
          git config user.email "actions@users.noreply.github.com"
          git add forge-intelligence/execution-records/zensia-motion-masks.json
          git commit -m "Record Zensia motion mask preflight [forge-preflight-record]"
          git push origin HEAD:project/zensia-motion-masks
