name: Studio Pro release acceptance
on:
  push:
    branches: [feat/studio-pro-final]
    paths: [.github/workflows/studio-pro-apply.yml]
permissions:
  contents: write
jobs:
  studio-pro:
    if: github.ref == 'refs/heads/feat/studio-pro-final'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-pro-final
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify and apply reviewed source patch
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          const encoded = [1,2,3].map(n => readFileSync(`.github/studio-pro-part-${n}.b64`, 'utf8').trim()).join('');
          const patch = brotliDecompressSync(Buffer.from(encoded, 'base64'));
          const hash = createHash('sha256').update(patch).digest('hex');
          if (hash !== '9e75e585c65cd66c7d1d2379b7590be5ed139e533f90c3ef627e5c6be8434cb7') throw new Error(`Patch checksum mismatch: ${hash}`);
          writeFileSync('/tmp/studio-pro.patch', patch);
          NODE
          git apply --check /tmp/studio-pro.patch
          git apply /tmp/studio-pro.patch
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Save validated native source on isolated feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore app/studio app/api/studio/assets src/studio src/components/three/LabOrbitControls.tsx tests/studio-pro-authoring.test.ts tests/studio-local-assets.test.ts scripts/verify-studio-pro.mjs docs/STUDIO_PRO.md
          git commit -m 'Build Studio Pro authoring release with camera capture, asset import and version history'
          git push origin HEAD:feat/studio-pro-final
      - run: npx playwright install --with-deps chromium
      - name: Verify real scene authoring and responsive layouts
        timeout-minutes: 12
        run: GITHUB_SHA=$(git rev-parse HEAD) node --import tsx scripts/verify-studio-pro.mjs
      - name: Upload acceptance report and actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-pro-release-evidence
          path: test-results/studio-pro/
          if-no-files-found: warn
          retention-days: 7
