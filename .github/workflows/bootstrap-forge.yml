name: Bootstrap Immersive Site Forge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-forge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Forge archive
        shell: bash
        run: |
          set -euo pipefail
          cat .forge-bootstrap/part-* | base64 --decode > /tmp/immersive-site-forge.zip
          unzip -t /tmp/immersive-site-forge.zip >/dev/null

      - name: Replace bootstrap tree with Forge repository
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/immersive-site-forge.zip -d .
          git status --short

      - name: Commit full Forge repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: install Immersive Site Forge"
          git push origin HEAD:main
