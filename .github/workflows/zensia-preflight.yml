name: Zensia Forge Preflight

on:
  push:
    branches:
      - project/zensia-coffee
    paths:
      - .github/workflows/zensia-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create local Zensia request
        run: |
          mkdir -p .forge/execution/zensia-coffee
          cat > .forge/execution/zensia-coffee/request.txt <<'EOF'
          Business: https://www.zensiacoffee.com/

          Build a significantly better website for Zensia Coffee using the full Forge system.

          Business truth to preserve:
          - Zensia is a specialty Colombian coffee brand and physical cafe in Clayton / St. Louis.
          - The existing public site positions the brand around calm, intentional pauses, Colombian coffee, community, digital ordering, gift cards and Calm Club rewards.
          - The current website under-expresses the brand: it behaves like a long utility/content stack rather than a memorable hospitality experience.
          - Primary commercial actions must remain obvious and semantic: Order Online, View Menu, Visit, Calm Club / Rewards.
          - Do not invent awards, farm names, prices, sourcing claims, statistics, testimonials, events or product facts that are not verified.
          - Existing third-party editorial photography may be used only as research reference unless reuse rights are confirmed.

          Creative objective:
          Turn Zensia into a culturally grounded, sensory hospitality brand experience rather than a generic coffee-shop landing page. The experience should feel like entering a deliberate pause: outside noise gives way to calm, Colombian origin and coffee ritual become tangible, and conversion remains frictionless.

          Initial thesis candidate:
          NOISE -> THRESHOLD -> ORIGIN -> RITUAL -> PAUSE.

          Anti-cliches:
          - no floating coffee beans in a dark WebGL void
          - no generic beige luxury cafe template
          - no giant-serif-only art direction
          - no coffee-card wall as the primary experience
          - no constant maximum motion
          - no copying Atelier Maris, Heliot, Nocturne or other prior Forge project signatures
          - no full cafe reconstruction in mediocre 3D merely to say the site is 3D

          Desired qualities:
          tactile, calm, Colombian, contemporary, warm, spatial, editorial, restrained, sensorial, community-aware, commercially usable.

          Explore Forge-native solutions including threshold/arrival grammar, visual silence, selective refractive/frosted-glass interaction, material continuity, subtle camera movement, semantic DOM commerce actions, mobile-specific art direction, and a single protected signature peak.
          EOF
      - name: Run full Forge preflight
        env:
          STUDIO_AUTH_ENABLED: "false"
          FORGE_LOCAL_STORAGE_ENABLED: "true"
          NODE_ENV: development
        run: |
          npm run forge:preflight -- \
            --name="Zensia Coffee" \
            --prompt-file=.forge/execution/zensia-coffee/request.txt \
            --business-url=https://www.zensiacoffee.com/ \
            --artifacts=.forge/execution/zensia-coffee/artifacts \
            --record=forge-intelligence/execution-records/zensia-coffee.json
      - name: Validate execution evidence
        run: npm run forge:execution:audit -- --record=forge-intelligence/execution-records/zensia-coffee.json
      - name: Print Forge Build Packet
        run: |
          echo '===== ZENSIA FORGE BUILD PACKET ====='
          cat .forge/execution/zensia-coffee/artifacts/forge-build-packet.md
          echo '===== END ZENSIA FORGE BUILD PACKET ====='
      - name: Commit public-safe preflight record
        run: |
          git config user.name "forge-preflight"
          git config user.email "actions@users.noreply.github.com"
          git add forge-intelligence/execution-records/zensia-coffee.json
          git commit -m "Record Zensia Forge preflight [forge-preflight-record]"
          git push origin HEAD:project/zensia-coffee
