name: Zensia Forge Preflight

on:
  push:
    branches:
      - project/zensia-coffee
    paths:
      - .github/workflows/zensia-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create local Zensia request
        run: |
          mkdir -p .forge/execution/zensia-coffee
          cat > .forge/execution/zensia-coffee/request.txt <<'EOF'
          Business: https://www.zensiacoffee.com/

          Build a significantly better website for Zensia Coffee with the full Forge system.

          Zensia is a Colombian specialty-coffee and hospitality brand in Clayton / St. Louis. Preserve its real themes: calm intentional pauses, Colombian coffee, community, ordering, menu, visit and rewards. Do not invent awards, farms, prices, sourcing facts, statistics, testimonials or events.

          Creative objective: make the site feel like entering a deliberate pause. The experience should move from outside noise into calm, then reveal Colombian origin, coffee ritual and the physical/social atmosphere of Zensia while keeping conversion frictionless.

          Thesis candidate: NOISE -> THRESHOLD -> ORIGIN -> RITUAL -> PAUSE.

          Avoid generic beige cafe luxury, floating beans in dark WebGL, giant-serif-only art direction, card-wall structure, constant motion, mediocre full-cafe 3D, and signatures copied from prior Forge projects.

          Desired language: tactile, calm, Colombian, contemporary, warm, spatial, editorial, restrained, sensorial and commercially usable. Favor one protected signature peak, visual silence, threshold/arrival grammar, selective frost/refraction, subtle camera behavior, mobile-specific composition and semantic commerce actions.
          EOF
      - name: Run full Forge preflight
        env:
          STUDIO_AUTH_ENABLED: "false"
          FORGE_LOCAL_STORAGE_ENABLED: "true"
          NODE_ENV: development
        run: |
          npm run forge:preflight -- \
            --name="Zensia Coffee" \
            --prompt-file=.forge/execution/zensia-coffee/request.txt \
            --business-url=https://www.zensiacoffee.com/ \
            --artifacts=.forge/execution/zensia-coffee/artifacts \
            --record=forge-intelligence/execution-records/zensia-coffee.json
      - name: Validate execution evidence
        run: npm run forge:execution:audit -- --record=forge-intelligence/execution-records/zensia-coffee.json
      - name: Print Forge Build Packet
        run: |
          echo '===== ZENSIA FORGE BUILD PACKET ====='
          cat .forge/execution/zensia-coffee/artifacts/forge-build-packet.md
          echo '===== END ZENSIA FORGE BUILD PACKET ====='
      - name: Commit public-safe preflight record
        run: |
          git config user.name "forge-preflight"
          git config user.email "actions@users.noreply.github.com"
          git add forge-intelligence/execution-records/zensia-coffee.json
          git commit -m "Record Zensia Forge preflight [forge-preflight-record]"
          git push origin HEAD:project/zensia-coffee
