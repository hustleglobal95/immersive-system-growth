name: Zensia Forge Preflight

on:
  push:
    branches:
      - project/zensia-coffee
    paths:
      - .github/workflows/zensia-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create structured Zensia Director brief
        run: |
          mkdir -p .forge/execution/zensia-coffee
          cat > .forge/execution/zensia-coffee/brief.json <<'EOF'
          {
            "projectName": "Zensia Coffee",
            "projectType": "hospitality",
            "tier": "signature",
            "client": "Zensia Coffee",
            "audience": "Coffee drinkers, design-aware locals, remote workers and visitors looking for a calm Colombian specialty-coffee experience in Clayton and St. Louis.",
            "objective": "Make Zensia feel like a deliberate pause from the city: communicate Colombian origin, coffee ritual, hospitality and community, then convert interest into visits, menu exploration, online orders and rewards signups.",
            "primaryAction": "Visit Zensia",
            "brandTruth": "Zensia is a Colombian specialty-coffee hospitality brand built around calm, lingering and intentional pauses. Its strongest story is the contrast between city noise and a warm, serene place where coffee origin, preparation and human connection matter.",
            "differentiators": [
              "Colombian specialty-coffee point of view",
              "A physical space intentionally designed for lingering and calm",
              "Coffee ritual and origin as part of the guest experience",
              "Community and repeat-visit behavior through Calm Club"
            ],
            "constraints": [
              "Keep Order Online, Menu, Visit and Calm Club actions obvious and semantic",
              "Do not invent awards, farms, prices, sourcing statistics, testimonials or events",
              "Do not use third-party editorial photography as production art without confirmed rights",
              "Avoid generic beige cafe luxury, floating coffee beans, constant motion and card-wall structure",
              "Do not reuse prior Forge project signatures or reconstruct the entire cafe in mediocre 3D",
              "Mobile must preserve the threshold-to-pause narrative rather than hiding it"
            ],
            "existingAssets": [],
            "references": [
              {
                "label": "Zensia existing public website",
                "lesson": "Preserve the brand's calm, Colombian coffee, ordering, rewards and community truths while replacing the current utility-heavy content stack with a stronger spatial hospitality narrative."
              },
              {
                "label": "Forge hospitality construction intelligence",
                "lesson": "Use atmosphere first, a motivated arrival threshold, tactile intimacy, density rhythm and visual silence, with one protected signature peak and clear conversion utility."
              }
            ]
          }
          EOF
      - name: Run full Forge preflight
        env:
          STUDIO_AUTH_ENABLED: "false"
          FORGE_LOCAL_STORAGE_ENABLED: "true"
          NODE_ENV: development
        run: |
          npm run forge:preflight -- \
            --name="Zensia Coffee" \
            --brief=.forge/execution/zensia-coffee/brief.json \
            --artifacts=.forge/execution/zensia-coffee/artifacts \
            --record=forge-intelligence/execution-records/zensia-coffee.json
      - name: Validate execution evidence
        run: npm run forge:execution:audit -- --record=forge-intelligence/execution-records/zensia-coffee.json
      - name: Print Forge Build Packet
        run: |
          echo '===== ZENSIA FORGE BUILD PACKET ====='
          cat .forge/execution/zensia-coffee/artifacts/forge-build-packet.md
          echo '===== END ZENSIA FORGE BUILD PACKET ====='
      - name: Commit public-safe preflight record
        run: |
          git config user.name "forge-preflight"
          git config user.email "actions@users.noreply.github.com"
          git add forge-intelligence/execution-records/zensia-coffee.json
          git commit -m "Record Zensia Forge preflight [forge-preflight-record]"
          git push origin HEAD:project/zensia-coffee
