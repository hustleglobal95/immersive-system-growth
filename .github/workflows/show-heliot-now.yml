name: Show HELIOT Now

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: show-heliot-now
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Activate exact restored HELIOT project
        run: npm run project:activate -- heliot
      - name: Build exact restored HELIOT project
        run: npm run build
      - name: Deploy exact restored HELIOT preview
        run: npx --yes vercel@latest deploy --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
