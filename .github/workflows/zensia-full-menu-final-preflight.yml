name: Zensia Full Menu Final Preflight

on:
  push:
    branches:
      - project/zensia-full-menu-final
    paths:
      - .github/workflows/zensia-full-menu-final-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write structured brief
        run: |
          mkdir -p .forge/execution/zensia-full-menu-final
          cat > .forge/execution/zensia-full-menu-final/brief.json <<'EOF'
          {
            "projectName": "Zensia Full Immersive Menu Final",
            "projectType": "hospitality",
            "tier": "signature",
            "client": "Zensia Coffee",
            "audience": "Visitors browsing Zensia's full menu before or during a café visit.",
            "objective": "Integrate the complete current Zensia menu and the user-supplied coffee splash animation into the existing immersive website as one coherent interactive scene.",
            "primaryAction": "Order online",
            "brandTruth": "The menu itself should feel like part of the Zensia coffee experience rather than a detached utility page.",
            "differentiators": [
              "Complete current menu inside the site",
              "User-supplied coffee splash motion",
              "GSAP spatial interaction",
              "Direct ordering"
            ],
            "constraints": [
              "Represent all 44 current core menu items",
              "Represent all 11 listed flavor variants",
              "Do not invent prices, sizes, ingredients or availability",
              "Use the supplied coffee splash only as a decorative kinetic object",
              "Remove the baked checkerboard from the supplied animation",
              "Keep all text and controls readable, keyboard accessible and touch friendly",
              "Disable the decorative splash for prefers-reduced-motion",
              "Preserve mobile without horizontal page overflow"
            ],
            "existingAssets": [],
            "references": [
              {"label":"Zensia Actual Menu","lesson":"Preserve current public menu names and category grouping."},
              {"label":"User-supplied coffee splash animation","lesson":"Use as a kinetic coffee-material accent inside the menu stage."}
            ]
          }
          EOF
      - name: Run Forge preflight
        env:
          STUDIO_AUTH_ENABLED: "false"
          FORGE_LOCAL_STORAGE_ENABLED: "true"
          NODE_ENV: development
        run: |
          npm run forge:preflight --             --name="Zensia Full Immersive Menu Final"             --brief=.forge/execution/zensia-full-menu-final/brief.json             --artifacts=.forge/execution/zensia-full-menu-final/artifacts             --record=forge-intelligence/execution-records/zensia-full-menu-final.json
      - name: Validate execution evidence
        run: npm run forge:execution:audit -- --record=forge-intelligence/execution-records/zensia-full-menu-final.json
      - name: Commit public-safe record
        run: |
          git config user.name "forge-preflight"
          git config user.email "actions@users.noreply.github.com"
          git add forge-intelligence/execution-records/zensia-full-menu-final.json
          git commit -m "Record Zensia full menu final preflight [forge-preflight-record]"
          git push origin HEAD:project/zensia-full-menu-final
