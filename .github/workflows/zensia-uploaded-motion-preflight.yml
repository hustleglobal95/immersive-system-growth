name: Zensia Uploaded Motion Preflight

on:
  push:
    branches:
      - project/zensia-full-immersive-menu
    paths:
      - .github/workflows/zensia-uploaded-motion-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write structured uploaded-motion brief
        run: |
          mkdir -p .forge/execution/zensia-uploaded-motion
          cat > .forge/execution/zensia-uploaded-motion/brief.json <<'EOF'
          {
            "projectName": "Zensia Uploaded Coffee Motion",
            "projectType": "hospitality",
            "tier": "signature",
            "client": "Zensia Coffee",
            "audience": "Visitors browsing the full immersive Zensia menu and evaluating what to order.",
            "objective": "Integrate the user-supplied coffee splash animation into the full immersive Zensia menu as a transparent kinetic media object with GSAP staging and responsive behavior.",
            "primaryAction": "Order online",
            "brandTruth": "The menu should feel like a living part of the coffee experience, with real coffee motion reinforcing product ritual without obscuring menu usability.",
            "differentiators": [
              "Complete current menu inside the site",
              "Real coffee/bean splash motion supplied by the user",
              "GSAP-driven spatial menu stage",
              "Direct online ordering"
            ],
            "constraints": [
              "Use the supplied animation as a decorative kinetic object only",
              "Remove the baked checkerboard before use",
              "Keep all menu text, controls and ordering links readable and interactive",
              "Do not hide content behind the animation",
              "Disable the decorative animated object for prefers-reduced-motion",
              "Preserve all 44 core menu items and 11 listed flavor variants",
              "No invented menu facts or pricing"
            ],
            "existingAssets": [],
            "references": [
              {
                "label": "User-supplied coffee splash animation",
                "lesson": "Use as a kinetic coffee-material accent inside the menu stage rather than as a generic full-screen background."
              }
            ]
          }
          EOF
      - name: Run Forge preflight
        env:
          STUDIO_AUTH_ENABLED: "false"
          FORGE_LOCAL_STORAGE_ENABLED: "true"
          NODE_ENV: development
        run: |
          npm run forge:preflight --             --name="Zensia Uploaded Coffee Motion"             --brief=.forge/execution/zensia-uploaded-motion/brief.json             --artifacts=.forge/execution/zensia-uploaded-motion/artifacts             --record=forge-intelligence/execution-records/zensia-uploaded-motion.json
      - name: Validate execution evidence
        run: npm run forge:execution:audit -- --record=forge-intelligence/execution-records/zensia-uploaded-motion.json
      - name: Commit public-safe record
        run: |
          git config user.name "forge-preflight"
          git config user.email "actions@users.noreply.github.com"
          git add forge-intelligence/execution-records/zensia-uploaded-motion.json
          git commit -m "Record Zensia uploaded motion preflight [forge-preflight-record]"
          git push origin HEAD:project/zensia-full-immersive-menu
